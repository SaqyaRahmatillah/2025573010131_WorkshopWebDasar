<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Latihan 1 - UI Components</title>
    <link rel="stylesheet" href="latihan-1.css" />
  </head>
  <body>
    <h2>Komponen Button</h2>
    <button class="btn-primary">Primary</button>
    <button class="btn-secondary">Secondary</button>
    <button class="btn-danger">Danger</button>
    <button class="btn-outline">Outline</button>

    <h2>Komponen Badge / Tag</h2>
    <span class="badge badge-success">Success</span>
    <span class="badge badge-warning">Warning</span>
    <span class="badge badge-error">Error</span>

    <h2>Komponen Alert Box</h2>
    <div class="alert alert-success">✅ Data berhasil disimpan</div>
    <div class="alert alert-warning">⚠️ Periksa kembali input Anda</div>
    <div class="alert alert-error">❌ Terjadi kesalahan sistem</div>
  </body>
</html>
