<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keranjang Belanja</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        background: #f5f5f5;
        padding: 20px;
      }

      h1 {
        text-align: center;
        margin-bottom: 20px;
      }

      .container {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 20px;
      }

      .products {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 20px;
      }

      .card {
        background: white;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }

      .card img {
        width: 100%;
        height: 180px;
        object-fit: cover;
      }

      .card-body {
        padding: 15px;
      }

      .card button {
        width: 100%;
        padding: 10px;
        border: none;
        background: green;
        color: white;
        border-radius: 8px;
        cursor: pointer;
      }

      .cart {
        background: white;
        padding: 20px;
        border-radius: 12px;
        height: fit-content;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }

      .cart-item {
        border-bottom: 1px solid #ddd;
        padding: 10px 0;
      }

      .cart-item button {
        padding: 5px 10px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        margin-top: 5px;
        margin-right: 5px;
      }

      .plus {
        background: green;
        color: white;
      }

      .minus {
        background: orange;
        color: white;
      }

      .delete {
        background: red;
        color: white;
      }

      .checkout {
        width: 100%;
        padding: 12px;
        margin-top: 15px;
        border: none;
        border-radius: 8px;
        background: blue;
        color: white;
        cursor: pointer;
      }

      .badge {
        background: red;
        color: white;
        border-radius: 50%;
        padding: 4px 10px;
        font-size: 14px;
      }

      @media (max-width: 768px) {
        .container {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <h1>
      Keranjang Belanja
      <span class="badge" id="cart-count">0</span>
    </h1>

    <div class="container">
      <div class="products" id="products"></div>

      <div class="cart">
        <h2>Keranjang</h2>

        <div id="cart-items"></div>

        <h3 id="total">Total: Rp0</h3>

        <button class="checkout" id="checkout-btn">Checkout</button>
      </div>
    </div>

    <script src="latihan-2.js"></script>
  </body>
</html>
