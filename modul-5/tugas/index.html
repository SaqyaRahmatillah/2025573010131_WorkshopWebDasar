<!doctype html>
<html lang="en" class="">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Landing Page</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>

  <body
    class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-white transition"
  >
    <!-- NAVBAR -->
    <nav
      class="sticky top-0 z-50 bg-white dark:bg-gray-800 shadow flex justify-between items-center px-6 py-4"
    >
      <h1 class="text-xl font-bold">MyBrand</h1>

      <!-- Hamburger (mobile only UI) -->
      <div class="md:hidden text-2xl cursor-pointer">☰</div>

      <!-- Menu -->
      <ul class="hidden md:flex gap-6">
        <li><a href="#">Home</a></li>
        <li><a href="#">Produk</a></li>
        <li><a href="#">Kontak</a></li>
      </ul>

      <!-- Dark Mode -->
      <button id="darkToggle" class="btn-primary ml-4">🌙</button>
    </nav>

    <!-- HERO -->
    <section class="text-center py-20 px-4">
      <h1 class="text-4xl md:text-5xl font-bold mb-4 animate-bounce">
        Selamat Datang 🚀
      </h1>
      <p class="mb-6">Landing page modern dengan Tailwind CSS</p>
      <button class="btn-primary">Mulai Sekarang</button>
    </section>

    <!-- PRODUK -->
    <section class="px-6 py-10">
      <h2 class="text-2xl font-bold mb-6 text-center">Produk Kami</h2>

      <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
        <div class="card hover:scale-105">
          <h3 class="font-bold">Produk 1</h3>
          <p>Deskripsi produk</p>
        </div>
        <div class="card">Produk 2</div>
        <div class="card">Produk 3</div>
        <div class="card">Produk 4</div>
        <div class="card">Produk 5</div>
        <div class="card">Produk 6</div>
      </div>
    </section>

    <!-- TESTIMONI -->
    <section class="px-6 py-10 bg-gray-200 dark:bg-gray-800">
      <h2 class="text-2xl font-bold mb-6 text-center">Testimoni</h2>

      <div class="grid md:grid-cols-2 gap-4">
        <div class="card animate-pulse">"Keren banget!"</div>
        <div class="card">"Sangat membantu!"</div>
      </div>
    </section>

    <!-- FORM -->
    <section class="px-6 py-10">
      <h2 class="text-xl font-bold mb-4 text-center">Kontak Kami</h2>

      <div class="max-w-md mx-auto">
        <input type="text" placeholder="Nama" class="input mb-3" />
        <input type="email" placeholder="Email" class="input mb-3" />
        <button class="btn-primary w-full">Kirim</button>
      </div>
    </section>

    <!-- FOOTER -->
    <footer class="text-center py-4 bg-white dark:bg-gray-800">
      © 2026 MyBrand
    </footer>

    <script src="/src/main.js"></script>
  </body>
</html>
